project:
  seed: 20260605
  experiment_id: cfd_tank_stable175
  solver: openfoam
  modality: cfd_wake_field

simulation:
  H: 0.45
  d_ratio: 0.1406
  x0: 0.25
  y0: 0.225
  L_in: 0.25
  L_out: 0.60
  density: 997.0
  U_mean: 0.0100
  re_values: [300, 500, 800, 1100, 1500]
  shapes: [circle, triangle, airfoil, diamond, bar]
  perturbations_per_combo: 7
  probes_n: 32
  workers: 0
  max_retries: 1
  perturb:
    enable_dy: true
    dy_min: -0.066666667
    dy_max: 0.066666667
    enable_eps: false
    eps_max: 0.0
  time:
    dt: 0.05
    transient_time: 0.0
    min_samples: 10
    min_cycles: 10

cfd:
  tank:
    length_m: 0.85
    depth_m: 0.45
    width_m: 0.40
  obstacle:
    area_m2: 0.005
    equivalent_diameter_m: 0.079788456
    center_x_m: 0.25
    center_y_m: 0.225
  fluid:
    nu_m2_s: 0.000001
  mesh:
    thickness_m: 0.01
    lc_far_m: 0.012
    lc_obstacle_m: 0.003
  time:
    dt_s: 0.05
    max_delta_t_s: 0.05
    max_co: 0.45
    adjust_time_step: true
    convective_end_tau: 10.0
    convective_write_tau: 1.0
  case_matrix:
    shapes: [circle, triangle, airfoil, diamond, bar]
    re_values: [300, 500, 800, 1100, 1500]
    dy_values_m: [-0.03, -0.02, -0.01, 0.0, 0.01, 0.02, 0.03]
    test_dy_values_m: [0.0]

ml:
  test_size: 0.2
  random_state: 42
  repeat_seeds: [42]
  n_estimators: 300
  cv_folds: 3
  robustness_bins: 4
  perm_repeats: 8

vision:
  sequence_frames: 8
  field_size: 128
  channels: [ux, uy, speed, vorticity]
  flow_estimator: farneback
  scales: [distD1.0_full, distD2.0_full, distD4.0_full]
  training:
    epochs: 40
    batch_size: 32
    lr: 0.0003
    weight_decay: 0.0001
    fusion_hidden: 256
    dropout: 0.15
    export_seed: 42
    val_ratio: 0.1
    early_stopping_patience: 8
    loss_weights:
      shape: 1.0
      params: 0.03
      re: 0.0

reconstruction:
  image_height: 64
  image_width: 128
  methods: [parametric_inverse]
  param_n_estimators: 400
  audit_n_estimators: 250
  param_min_samples_leaf: 1
  latent_dim: 48
  ridge_alpha: 1.0
  obstacle_threshold: 0.8
  confidence_threshold: 0.45
  repeat_seeds: [42]
